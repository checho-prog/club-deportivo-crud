{% extends "base.html" %}
{% block titulo %}{{ accion }} instructor{% endblock %}
{% block contenido %}
<div class="encabezado"><div><h1>{{ accion }} instructor</h1><p>Solo los instructores activos aparecen al programar clases.</p></div></div>
<form class="formulario" method="post">
  <div class="campos">
    <div class="campo">
      <label for="documento">Documento *</label>
      <input id="documento" name="documento" required value="{{ instructor.documento if instructor else '' }}">
    </div>
    <div class="campo">
      <label for="deporte_id">Deporte *</label>
      <select id="deporte_id" name="deporte_id" required>
        {% for d in deportes %}
        <option value="{{ d.id }}" {{ 'selected' if instructor and instructor.deporte_id|string == d.id|string }}>{{ d.nombre }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="nombres">Nombres *</label>
      <input id="nombres" name="nombres" required value="{{ instructor.nombres if instructor else '' }}">
    </div>
    <div class="campo">
      <label for="apellidos">Apellidos *</label>
      <input id="apellidos" name="apellidos" required value="{{ instructor.apellidos if instructor else '' }}">
    </div>
    <div class="campo">
      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" value="{{ instructor.correo or '' if instructor else '' }}">
    </div>
    <div class="campo">
      <label for="telefono">Telefono</label>
      <input id="telefono" name="telefono" value="{{ instructor.telefono or '' if instructor else '' }}">
    </div>
    <div class="campo">
      <label for="tarifa_hora">Tarifa por hora</label>
      <input type="number" step="1000" min="0" id="tarifa_hora" name="tarifa_hora"
             value="{{ instructor.tarifa_hora if instructor else 0 }}">
    </div>
    <div class="campo casilla">
      <input type="checkbox" id="activo" name="activo" {{ 'checked' if not instructor or instructor.activo }}>
      <label for="activo">Esta activo</label>
    </div>
  </div>
  <div class="pie-formulario">
    <button class="boton" type="submit">Guardar</button>
    <a class="boton secundario" href="{{ url_for('instructores_listar') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
